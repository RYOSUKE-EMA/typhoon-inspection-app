<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現場点検システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #b3382c;
    --accent-dark: #8f2c22;
    --ink: #1f2427;
    --ink-soft: #5b656b;
    --line: #d9dee1;
    --line-soft: #e8ecee;
    --bg: #eef1f3;
    --panel: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--panel);
    border-bottom: 2px solid var(--accent);
    padding: 14px 24px;
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink);
  }
  header h1 span { color: var(--accent); }
  header a { color: var(--ink-soft); text-decoration: none; font-size: 0.85rem; }
  header a:hover { color: var(--accent); }
  .container { max-width: 1120px; margin: 26px auto; padding: 0 18px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 26px;
    margin-bottom: 20px;
  }
  h2 {
    color: var(--ink);
    font-size: 1.08rem;
    font-weight: 700;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    letter-spacing: 0.02em;
  }
  h2 .accent-bar {
    display: inline-block;
    width: 4px;
    height: 1em;
    background: var(--accent);
    margin-right: 10px;
    transform: translateY(2px);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 9px 20px;
    border-radius: 3px;
    border: 1px solid transparent;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.12s, border-color 0.12s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-success { background: #1e7d47; color: #fff; }
  .btn-success:hover { background: #17633799; }
  .btn-secondary { background: #fff; color: var(--ink); border-color: var(--line); }
  .btn-secondary:hover { border-color: var(--ink-soft); }
  .btn-danger { background: #fff; color: var(--accent); border-color: var(--accent); }
  .btn-danger:hover { background: var(--accent); color: #fff; }
  .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
  input[type=text], input[type=date], input[type=datetime-local], input[type=number], textarea, select {
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 11px;
    font-size: 0.9rem;
    width: 100%;
    background: #fff;
    color: var(--ink);
  }
  input[type=file] { font-size: 0.9rem; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(179,56,44,0.12); }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th {
    background: #f4f6f7;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 9px 8px;
    text-align: center;
    border-bottom: 2px solid var(--line);
    font-size: 0.82rem;
    letter-spacing: 0.02em;
  }
  td { padding: 9px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tr:hover td { background: #faf6f5; }
  .list-table th, .list-table td { border-right: 1px solid var(--line-soft); }
  .list-table th:last-child, .list-table td:last-child { border-right: none; }
  .list-table .col-no { width: 110px; }
  .flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .alert { padding: 11px 15px; border-radius: 3px; margin-bottom: 15px; }
  .alert-info { background: #fbeeec; border-left: 3px solid var(--accent); color: var(--ink); }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 2px;
    font-size: 0.76rem;
    font-weight: 500;
    border: 1px solid;
  }
  .badge-pending { background: #fff5ea; color: #b5670c; border-color: #e6b877; }
  .badge-done { background: #eef7f1; color: #1e7d47; border-color: #9dccb0; }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  .menu-card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 26px 22px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.12s, transform 0.12s;
    position: relative;
    border-left: 3px solid var(--accent);
  }
  .menu-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .menu-card .icon { font-size: 1.7rem; display: block; margin-bottom: 10px; }
  .menu-card .title { font-size: 1.02rem; font-weight: 700; color: var(--ink); }
  .menu-card .desc { font-size: 0.83rem; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }
  .menu-card .pending-badge { position: absolute; top: 12px; right: 12px; }
  label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 5px; font-weight: 500; }
  .form-row { margin-bottom: 15px; }
  .item-table th, .item-table td { text-align: left; }
  .item-table td.no { text-align: center; width: 42px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .item-table select { width: auto; min-width: 104px; }
  .item-table tbody tr:hover td { background: #faf6f5; }
  .footer-note { font-size: 0.82rem; color: var(--ink-soft); margin-top: 8px; }
  /* 点検結果の凡例 */
  .legend {
    background: #f7f9fa;
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 3px;
    padding: 11px 15px;
    margin-bottom: 16px;
    font-size: 0.86rem;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  /* 検索・フィルタ欄 */
  .filter-bar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding: 12px 14px;
    background: #f7f9fa;
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  .filter-bar input, .filter-bar select { width: auto; }
  .filter-bar .search-input { min-width: 240px; flex: 1; }
  .filter-bar .filter-label { font-size: 0.82rem; color: var(--ink-soft); font-weight: 500; }
  .no-match-msg { color: var(--ink-soft); font-size: 0.9rem; padding: 10px 2px; }
  details.month-group { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 10px; overflow: hidden; }
  details.month-group > summary {
    cursor: pointer;
    font-weight: 700;
    font-size: 0.98rem;
    padding: 12px 16px;
    background: #f4f6f7;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  details.month-group > summary::-webkit-details-marker { display: none; }
  details.month-group > summary::before {
    content: "▸";
    color: var(--accent);
    font-size: 0.8rem;
    transition: transform 0.12s;
  }
  details.month-group[open] > summary::before { transform: rotate(90deg); }
  details.month-group .group-count { color: var(--ink-soft); font-weight: 500; font-size: 0.85rem; }
  details.month-group table { padding: 0; }
  details.month-group .table-wrap { padding: 6px 12px 12px; }
  /* 送信中オーバーレイ */
  #submit-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(31,36,39,0.72);
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }
  #submit-overlay.show { display: flex; }
  #submit-overlay .box {
    background: #fff;
    border-radius: 6px;
    padding: 40px 56px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  #submit-overlay .spinner {
    width: 52px;
    height: 52px;
    border: 5px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #submit-overlay .msg { font-size: 1.4rem; font-weight: 700; color: var(--ink); letter-spacing: 0.05em; }
  #submit-overlay .sub { font-size: 0.9rem; color: var(--ink-soft); margin-top: 10px; }
  /* 項目の手引きリンク */
  .guide-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 8px;
    padding: 1px 8px;
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--accent);
    background: #fff;
    border: 1px solid var(--accent);
    border-radius: 2px;
    cursor: pointer;
    vertical-align: middle;
    white-space: nowrap;
  }
  .guide-link:hover { background: var(--accent); color: #fff; }
  /* 手引きモーダル */
  #guide-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(31,36,39,0.6);
    z-index: 9998;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #guide-modal.show { display: flex; }
  #guide-modal .g-box {
    background: #fff;
    border-radius: 6px;
    max-width: 640px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 12px 44px rgba(0,0,0,0.32);
  }
  #guide-modal .g-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: #fff;
  }
  #guide-modal .g-title { font-size: 1rem; font-weight: 700; line-height: 1.5; flex: 1; }
  #guide-modal .g-close {
    border: none;
    background: none;
    font-size: 1.5rem;
    line-height: 1;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 0 4px;
  }
  #guide-modal .g-body { padding: 20px 22px; }
  #guide-modal .g-image { width: 100%; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 16px; display: block; }
  #guide-modal .g-desc { font-size: 0.92rem; line-height: 1.75; white-space: pre-wrap; color: var(--ink); }
  #guide-modal .g-empty { color: var(--ink-soft); font-size: 0.9rem; }
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
<header>
  <h1><span>■</span> 現場点検システム</h1>
  <a href="{{ url_for('index') }}">トップ</a>
</header>
<div class="container">
  {% block content %}{% endblock %}
</div>

<div id="submit-overlay">
  <div class="box">
    <div class="spinner"></div>
    <div class="msg">送信中...</div>
    <div class="sub">画面が切り替わるまでお待ちください</div>
  </div>
</div>

<div id="guide-modal">
  <div class="g-box">
    <div class="g-head">
      <div class="g-title" id="guide-title"></div>
      <button type="button" class="g-close" id="guide-close" aria-label="閉じる">×</button>
    </div>
    <div class="g-body">
      <img class="g-image" id="guide-image" alt="参考画像" style="display:none;">
      <div class="g-desc" id="guide-desc"></div>
      <div class="g-empty" id="guide-empty" style="display:none;">この項目の手引きはまだ登録されていません。</div>
    </div>
  </div>
</div>

<script>
// 送信ロック：data-lock付きフォームの送信時にオーバーレイを出し、二重送信を防ぐ
document.addEventListener("submit", function (e) {
  var form = e.target;
  if (!form.hasAttribute("data-lock")) return;
  if (form.dataset.submitted === "1") { e.preventDefault(); return; }
  form.dataset.submitted = "1";
  document.getElementById("submit-overlay").classList.add("show");
  form.querySelectorAll("button[type=submit]").forEach(function (b) { b.disabled = true; });
});

// 項目の手引きモーダル
(function () {
  var modal = document.getElementById("guide-modal");
  var titleEl = document.getElementById("guide-title");
  var imgEl = document.getElementById("guide-image");
  var descEl = document.getElementById("guide-desc");
  var emptyEl = document.getElementById("guide-empty");

  function closeModal() { modal.classList.remove("show"); }

  document.getElementById("guide-close").addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  document.addEventListener("click", function (e) {
    var link = e.target.closest(".guide-link");
    if (!link) return;
    e.preventDefault();
    var category = link.dataset.category;
    var subtype = link.dataset.subtype || "";
    var item = link.dataset.item;

    titleEl.textContent = item;
    imgEl.style.display = "none";
    imgEl.removeAttribute("src");
    descEl.textContent = "読み込み中...";
    emptyEl.style.display = "none";
    modal.classList.add("show");

    var url = "/api/guide/" + encodeURIComponent(category)
      + "?subtype=" + encodeURIComponent(subtype)
      + "&item=" + encodeURIComponent(item);
    fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      if (d.image_url) { imgEl.src = d.image_url; imgEl.style.display = "block"; }
      if (d.description) {
        descEl.textContent = d.description;
        descEl.style.display = "block";
      } else {
        descEl.style.display = "none";
      }
      if (!d.image_url && !d.description) { emptyEl.style.display = "block"; }
    }).catch(function () {
      descEl.textContent = "読み込みに失敗しました。";
    });
  });
})();
</script>
</body>
</html>
