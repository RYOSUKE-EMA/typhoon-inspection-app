name: keep warm

# 業務時間帯（平日 7:00-19:00 JST = 22:00-10:00 UTC）に10分おきにアクセスして
# Vercelサーバレスのコールドスタートを減らす
on:
  schedule:
    - cron: "*/10 22,23 * * 0-4"
    - cron: "*/10 0-9 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping app
        run: |
          curl -s -o /dev/null -w "app %{http_code} %{time_total}s\n" --max-time 30 https://typhoon-inspection-app.vercel.app/ || true
          curl -s -o /dev/null -w "api %{http_code} %{time_total}s\n" --max-time 30 https://typhoon-inspection-app.vercel.app/api/projects || true
